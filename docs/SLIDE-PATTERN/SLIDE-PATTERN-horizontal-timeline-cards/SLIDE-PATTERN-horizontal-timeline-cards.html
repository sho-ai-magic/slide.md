<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-horizontal-timeline-cards</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

  .content-area { flex: 1; padding: 32px 64px 40px; display: flex; flex-direction: column; overflow: hidden; }
  .timeline-row { display: flex; align-items: center; padding: 0 48px; margin-bottom: 32px; position: relative; }
  .timeline-line { position: absolute; top: 50%; left: 48px; right: 48px; height: 4px; background: #DDDDDD; z-index: 0; }
  .timeline-dots { display: flex; justify-content: space-around; width: 100%; position: relative; z-index: 1; }
  .timeline-dot { width: 28px; height: 28px; border-radius: 50%; background: #CCCCCC; border: 4px solid #FFFFFF; }
  .cards-row { display: flex; gap: 24px; flex: 1; }
  .card { flex: 1; background: #F8F8F8; border: 1px solid #E0E0E0; border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; }
  .step-label { font-size: 18px; color: #888; margin-bottom: 4px; }
  .step-number { font-size: 56px; font-weight: bold; color: #CCCCCC; line-height: 1.1; margin-bottom: 12px; }
  .card-heading { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 16px; line-height: 1.3; }
  .card-bullets { list-style: none; padding: 0; margin: 0; }
  .card-bullets li { font-size: 20px; color: #666; padding: 4px 0; line-height: 1.5; }
  .card-bullets li::before { content: "▶ "; color: #BBBBBB; font-size: 16px; }
</style>
</head>
<body>
<p class="slide-label">[horizontal-timeline-cards]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div class="content-area">
        <div class="area-label" style="margin-bottom:8px;">タイムライン</div>
        <div class="timeline-row">
          <div class="timeline-line"></div>
          <div class="timeline-dots">
            <div class="timeline-dot"></div>
            <div class="timeline-dot"></div>
            <div class="timeline-dot"></div>
            <div class="timeline-dot"></div>
          </div>
        </div>
        <div class="area-label">ステップカード</div>
        <div class="cards-row">
          <div class="card">
            <div class="step-label">STEP</div>
            <div class="step-number">01</div>
            <div class="card-heading">見出しが入ります</div>
            <ul class="card-bullets">
              <li>詳細ポイント1</li>
              <li>詳細ポイント2</li>
            </ul>
          </div>
          <div class="card">
            <div class="step-label">STEP</div>
            <div class="step-number">02</div>
            <div class="card-heading">見出しが入ります</div>
            <ul class="card-bullets">
              <li>詳細ポイント1</li>
              <li>詳細ポイント2</li>
            </ul>
          </div>
          <div class="card">
            <div class="step-label">STEP</div>
            <div class="step-number">03</div>
            <div class="card-heading">見出しが入ります</div>
            <ul class="card-bullets">
              <li>詳細ポイント1</li>
              <li>詳細ポイント2</li>
            </ul>
          </div>
          <div class="card">
            <div class="step-label">STEP</div>
            <div class="step-number">04</div>
            <div class="card-heading">見出しが入ります</div>
            <ul class="card-bullets">
              <li>詳細ポイント1</li>
              <li>詳細ポイント2</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
