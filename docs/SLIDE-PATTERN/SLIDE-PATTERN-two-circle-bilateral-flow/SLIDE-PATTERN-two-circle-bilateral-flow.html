<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-two-circle-bilateral-flow</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .placeholder-box { background: #F0F0F0; border: 2px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; color: #AAAAAA; font-size: 24px; }

  /* コンテンツエリア */
  .content-area { flex: 1; display: flex; align-items: center; padding: 24px 64px 16px; gap: 0; overflow: hidden; }
  .big-circle { width: 380px; height: 380px; border-radius: 50%; background: #F0F0F0; border: 1px dashed #CCCCCC; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; gap: 12px; }
  .sub-tag { padding: 6px 20px; background: #DDDDDD; border-radius: 24px; font-size: 20px; color: #666; }
  .center-flow { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 32px; }
  .flow-band { width: 100%; height: 68px; background: #DDDDDD; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; color: #555; }
  .flow-sub { font-size: 20px; color: #999; }
  .bottom-labels { display: flex; justify-content: space-between; padding: 12px 104px 20px; flex-shrink: 0; }
</style>
</head>
<body>
<p class="slide-label">[two-circle-bilateral-flow]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <div class="content-area">
        <!-- 左大円 -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
          <div class="big-circle">
            <div class="area-label">Left Entity</div>
            <div style="font-size:26px; font-weight:bold; color:#555; text-align:center;">主体A名<br>（補足情報）</div>
            <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; padding:0 32px;">
              <div class="sub-tag">要素1</div>
              <div class="sub-tag">要素2</div>
              <div class="sub-tag">要素3</div>
            </div>
          </div>
        </div>
        <!-- 中央フロー -->
        <div class="center-flow">
          <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div class="flow-sub">↑ フロー名A（←）</div>
            <div class="flow-band">ラベルA（A→B方向）</div>
            <div class="flow-sub">フロー名B（→）</div>
          </div>
          <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div class="flow-band" style="background:#EEEEEE; border:1px solid #CCCCCC;">ラベルB（B→A方向）</div>
            <div class="flow-sub">↓ フロー名B（→）</div>
          </div>
        </div>
        <!-- 右大円 -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
          <div class="big-circle">
            <div class="area-label">Right Entity</div>
            <div style="font-size:26px; font-weight:bold; color:#555; text-align:center;">主体B名<br>（補足情報）</div>
            <div style="display:flex; flex-direction:column; gap:10px; align-items:center; padding:0 32px;">
              <div class="sub-tag">要素A</div>
              <div class="sub-tag">要素B</div>
              <div class="sub-tag">要素C</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-labels">
        <div style="font-size:28px; font-weight:600; color:#555;">左エンティティ名</div>
        <div style="font-size:28px; font-weight:600; color:#555;">右エンティティ名</div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
