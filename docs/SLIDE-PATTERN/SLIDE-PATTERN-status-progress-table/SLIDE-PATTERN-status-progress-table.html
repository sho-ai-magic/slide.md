<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-status-progress-table</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .content-area { flex: 1; padding: 32px 80px; display: flex; flex-direction: column; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 24px; padding: 16px 32px; text-align: left; border-bottom: 4px solid #DDDDDD; color: #555; font-weight: bold; }
  td { font-size: 26px; padding: 20px 32px; border-bottom: 1px solid #EEEEEE; color: #333; vertical-align: middle; }
  td.item-name { font-weight: bold; }
  .status-badge { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; font-weight: bold; }
  .status-icon { font-size: 28px; }
  .status-done { color: #666; }
  .status-progress { color: #888; }
  .status-delayed { color: #999; background: #F5F5F5; }
  tr.delayed { background: #FAFAFA; }
</style>
</head>
<body>
<p class="slide-label">[status-progress-table]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div class="content-area">
        <div class="area-label">進捗ステータス表</div>
        <table>
          <thead>
            <tr>
              <th style="width:40%;">プロジェクト名 / 施策名</th>
              <th style="width:25%;">ステータス</th>
              <th>完了日 / 状況</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="item-name">❶ 施策名Aが入ります</td>
              <td><span class="status-badge status-done"><span class="status-icon">✓</span> 完了</span></td>
              <td>1/10</td>
            </tr>
            <tr>
              <td class="item-name">❷ 施策名Bが入ります</td>
              <td><span class="status-badge status-done"><span class="status-icon">✓</span> 完了</span></td>
              <td>1/15</td>
            </tr>
            <tr>
              <td class="item-name">❸ 施策名Cが入ります</td>
              <td><span class="status-badge status-done"><span class="status-icon">✓</span> 完了</span></td>
              <td>1/25</td>
            </tr>
            <tr>
              <td class="item-name">❹ 施策名Dが入ります</td>
              <td><span class="status-badge status-progress"><span class="status-icon">○</span> 進行中</span></td>
              <td>2/5予定</td>
            </tr>
            <tr class="delayed">
              <td class="item-name">❺ 施策名Eが入ります</td>
              <td><span class="status-badge status-delayed"><span class="status-icon">△</span> 遅延</span></td>
              <td>レビュー待ち（要確認）</td>
            </tr>
            <tr class="delayed">
              <td class="item-name">❻ 施策名Fが入ります</td>
              <td><span class="status-badge status-delayed"><span class="status-icon">△</span> 遅延</span></td>
              <td>データ不一致により保留</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
