<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-two-column-toc</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .toc-col { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .toc-item { display: flex; align-items: baseline; gap: 12px; padding: 18px 0; border-bottom: 1px solid #F0F0F0; }
  .toc-num { font-size: 26px; color: #888; flex-shrink: 0; width: 56px; }
  .toc-name { font-size: 28px; color: #333; flex: 1; }
  .toc-dots { flex: 1; border-bottom: 1px dotted #CCCCCC; margin: 0 12px; position: relative; top: -4px; }
  .toc-page { font-size: 26px; color: #888; flex-shrink: 0; width: 48px; text-align: right; }
  .col-divider { width: 1px; background: #EEEEEE; }
</style>
</head>
<body>
<p class="slide-label">[two-column-toc]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div style="display:flex; flex:1; overflow:hidden; padding:24px 120px; gap:80px;">
        <div class="toc-col">
          <div class="area-label">左列（項目1〜5）</div>
          <div class="toc-item">
            <div class="toc-num">1.</div>
            <div class="toc-name">目次項目1が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">02</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">2.</div>
            <div class="toc-name">目次項目2が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">04</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">3.</div>
            <div class="toc-name">目次項目3が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">06</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">4.</div>
            <div class="toc-name">目次項目4が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">10</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">5.</div>
            <div class="toc-name">目次項目5が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">14</div>
          </div>
        </div>
        <div class="col-divider"></div>
        <div class="toc-col">
          <div class="area-label">右列（項目6〜10）</div>
          <div class="toc-item">
            <div class="toc-num">6.</div>
            <div class="toc-name">目次項目6が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">32</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">7.</div>
            <div class="toc-name">目次項目7が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">35</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">8.</div>
            <div class="toc-name">目次項目8が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">40</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">9.</div>
            <div class="toc-name">目次項目9が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">45</div>
          </div>
          <div class="toc-item">
            <div class="toc-num">10.</div>
            <div class="toc-name">目次項目10が入ります</div>
            <div class="toc-dots"></div>
            <div class="toc-page">48</div>
          </div>
        </div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
