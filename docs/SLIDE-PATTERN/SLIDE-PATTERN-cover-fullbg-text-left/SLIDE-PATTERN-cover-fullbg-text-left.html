<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-cover-fullbg-text-left</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .placeholder-box { background: #F0F0F0; border: 2px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; color: #AAAAAA; font-size: 24px; }
  /* コンテンツエリア（frame: none のためタイトルエリア・フッターは配置しない） */
  .content-area { flex: 1; display: flex; overflow: hidden; }
  /* 左：テキストエリア */
  .left-col { width: 55%; padding: 64px 80px 80px 104px; display: flex; flex-direction: column; justify-content: flex-end; box-sizing: border-box; }
  .main-title { font-size: 56px; font-weight: bold; color: #333333; line-height: 1.3; margin-bottom: 32px; }
  .subtitle { font-size: 26px; color: #555555; margin-bottom: 12px; }
  .presenter-name { font-size: 28px; font-weight: 600; color: #444444; margin-bottom: 8px; }
  .affiliation { font-size: 24px; color: #777777; }
  /* 右：背景画像エリア */
  .right-col { width: 45%; background: #F0F0F0; border-left: 1px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; box-sizing: border-box; }
</style>
</head>
<body>
<p class="slide-label">[cover-fullbg-text-left]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">
      <!-- コンテンツエリア（スライド全面。frame: none のためタイトルエリア・フッターは配置しない） -->
      <div class="content-area">
        <!-- 左：テキストエリア -->
        <div class="left-col">
          <div class="area-label">Main Title</div>
          <div class="main-title">タイトルが<br>ここに入ります<br>複数行対応</div>
          <div class="area-label">Subtitle / Presenter / Affiliation</div>
          <div class="subtitle">イベント名 YYYY/MM/DD</div>
          <div class="presenter-name">発表者名 (@SNSハンドル)</div>
          <div class="affiliation">所属会社名</div>
        </div>
        <!-- 右：背景画像エリア -->
        <div class="right-col">
          <div class="area-label">Background</div>
          <div class="placeholder-box" style="width:100%; height:100px; border:none; background:transparent; color:#AAAAAA;">Image / Texture（写真添付エリア）</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
