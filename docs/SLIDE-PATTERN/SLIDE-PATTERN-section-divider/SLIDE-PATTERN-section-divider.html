<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-section-divider</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; }
  .slide-label { font-size: 16px; color: #666; margin-bottom: 6px; }

  .slide-outer {
    margin: 0 auto 32px;
    width: 1440px; /* 1920 × 0.75 */
  }

  .slide-wrapper {
    width: 1920px;
    transform-origin: top left;
    transform: scale(0.75);
    margin-bottom: -270px; /* 1080 × (1 - 0.75) = 270px */
  }

  .slide {
    width: 1920px;
    height: 1080px;
    background: #FFFFFF;
    border: 1px solid #CCCCCC;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .area-label {
    font-size: 20px;
    color: #999999;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  /* コンテンツエリア（スライド全面） */
  .content-area { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding: 0 160px; position: relative; }
  /* 左縦線アクセント */
  .left-accent { width: 8px; height: 240px; background: #CCCCCC; flex-shrink: 0; margin-right: 80px; }
  /* メインコンテンツ */
  .main-content { display: flex; flex-direction: column; gap: 20px; }
  .section-number { font-size: 96px; font-weight: bold; color: #AAAAAA; line-height: 1; letter-spacing: 0.05em; }
  .section-title { font-size: 64px; font-weight: bold; color: #333333; line-height: 1.2; }
  .section-subtitle { font-size: 30px; color: #666666; line-height: 1.5; margin-top: 8px; }
  /* 下部ページ範囲 */
  .footer-optional { position: absolute; bottom: 48px; right: 160px; font-size: 22px; color: #AAAAAA; }
</style>
</head>
<body>
<p class="slide-label">[section-divider]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">
      <!-- コンテンツエリア（スライド全面。frame: none のためタイトルエリア・フッターは配置しない） -->
      <div class="content-area">
        <!-- 左縦線アクセント -->
        <div class="left-accent"></div>
        <!-- セクション番号・タイトル・サブタイトル -->
        <div class="main-content">
          <div class="area-label" style="margin-bottom: 4px;">Section Number</div>
          <div class="section-number">02</div>
          <div class="area-label" style="margin-top: 8px; margin-bottom: 4px;">Section Title</div>
          <div class="section-title">セクションタイトルが入ります</div>
          <div class="area-label" style="margin-top: 8px; margin-bottom: 4px;">Sub Title</div>
          <div class="section-subtitle">このセクションの内容を補足するサブタイトルが入ります</div>
        </div>
        <!-- 下部ページ範囲テキスト（任意） -->
        <div class="footer-optional">P.10 – 15（オプション）</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
