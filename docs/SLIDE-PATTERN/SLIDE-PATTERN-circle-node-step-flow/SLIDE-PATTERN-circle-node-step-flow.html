<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-circle-node-step-flow</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .lead-text { font-size: 26px; color: #555; line-height: 1.7; margin-bottom: 56px; text-align: center; }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex: 1; }
  .node-wrap { display: flex; flex-direction: column; align-items: center; }
  .step-circle { width: 200px; height: 200px; border-radius: 50%; border: 4px solid #BBBBBB; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .step-circle.goal { background: #555555; border-color: #555555; }
  .step-circle.goal .step-name { color: #FFFFFF; }
  .step-name { font-size: 28px; font-weight: bold; color: #444; text-align: center; line-height: 1.3; }
  .step-sub { font-size: 20px; color: #888; text-align: center; }
  .connector { width: 64px; height: 4px; background: #CCCCCC; flex-shrink: 0; }
  .note-area { font-size: 22px; color: #888; line-height: 1.7; padding-top: 24px; }
</style>
</head>
<body>
<p class="slide-label">[circle-node-step-flow]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div style="display:flex; flex-direction:column; flex:1; overflow:hidden; padding:40px 104px;">
        <div class="area-label">Lead Text</div>
        <div class="lead-text">リード文が入ります。このフローについての説明を1〜2行で記述します。</div>
        <div class="flow-row">
          <div class="node-wrap">
            <div class="step-circle">
              <div class="step-name">ステップ1</div>
              <div class="step-sub">補足</div>
            </div>
          </div>
          <div class="connector"></div>
          <div class="node-wrap">
            <div class="step-circle">
              <div class="step-name">ステップ2</div>
              <div class="step-sub">(補足)</div>
            </div>
          </div>
          <div class="connector"></div>
          <div class="node-wrap">
            <div class="step-circle">
              <div class="step-name">ステップ3</div>
            </div>
          </div>
          <div class="connector"></div>
          <div class="node-wrap">
            <div class="step-circle">
              <div class="step-name">ステップ4</div>
            </div>
          </div>
          <div class="connector"></div>
          <div class="node-wrap">
            <div class="step-circle goal">
              <div class="step-name">ゴール</div>
              <div class="step-sub" style="color:#DDD;">最終ステップ</div>
            </div>
          </div>
        </div>
        <div class="note-area">
          <div class="area-label">Note (optional)</div>
          ※ 注記テキストが入ります。補足・条件・例外事項などを記述します。
        </div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
