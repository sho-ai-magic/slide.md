<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-vertical-step-flow</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .step-row { display: flex; align-items: stretch; }
  .step-label-cell { width: 240px; background: #E0E0E0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #555; padding: 16px; flex-shrink: 0; box-sizing: border-box; }
  .step-label-cell.final { background: #C0C0C0; color: #333; }
  .step-content-cell { flex: 1; border: 1px solid #E0E0E0; border-left: none; padding: 16px 40px; display: flex; align-items: center; font-size: 24px; color: #444; background: #FAFAFA; box-sizing: border-box; }
  .step-content-cell.final { background: #F0F0F0; font-weight: bold; }
  .arrow-row { display: flex; justify-content: center; padding: 4px 0; }
  .arrow { font-size: 28px; color: #BBBBBB; line-height: 1; }
</style>
</head>
<body>
<p class="slide-label">[vertical-step-flow]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div style="padding:16px 240px; display:flex; flex-direction:column; justify-content:center; gap:0; flex:1; overflow:hidden;">
        <div class="area-label" style="margin-bottom:8px;">縦ステップフロー</div>
        <div class="step-row">
          <div class="step-label-cell">STEP 1</div>
          <div class="step-content-cell">ステップ1の内容が入ります</div>
        </div>
        <div class="arrow-row"><div class="arrow">▼</div></div>
        <div class="step-row">
          <div class="step-label-cell">STEP 2</div>
          <div class="step-content-cell">ステップ2の内容が入ります</div>
        </div>
        <div class="arrow-row"><div class="arrow">▼</div></div>
        <div class="step-row">
          <div class="step-label-cell">STEP 3</div>
          <div class="step-content-cell">ステップ3の内容が入ります</div>
        </div>
        <div class="arrow-row"><div class="arrow">▼</div></div>
        <div class="step-row">
          <div class="step-label-cell">STEP 4</div>
          <div class="step-content-cell">ステップ4の内容が入ります</div>
        </div>
        <div class="arrow-row"><div class="arrow">▼</div></div>
        <div class="step-row">
          <div class="step-label-cell final">STEP 5</div>
          <div class="step-content-cell final">最終ステップの内容（強調）が入ります</div>
        </div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
