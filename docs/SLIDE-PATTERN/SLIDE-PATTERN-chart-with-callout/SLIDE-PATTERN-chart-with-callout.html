<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-chart-with-callout</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .placeholder-box { background: #F0F0F0; border: 2px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; color: #AAAAAA; font-size: 24px; }
</style>
</head>
<body>
<p class="slide-label">[chart-with-callout]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">

      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>

      <!-- コンテンツエリア -->
      <div style="display:flex; flex-direction:column; flex:1; overflow:hidden; padding:24px 60px;">

        <!-- 上段：本文テキスト（全幅） -->
        <div style="padding:0 0 24px; border-bottom:1px solid #E8E8E8; flex-shrink:0; margin-bottom:24px;">
          <div class="area-label">Body Text</div>
          <div style="font-size:26px; color:#333333; line-height:1.7;">
            本文テキストが入ります。データの背景や主張を2〜3行で説明します。<br>
            ここにスライドのメインメッセージを記述します。ボトムラインファースト形式が効果的です。
          </div>
        </div>

        <!-- 下段：チャート（左60%）＋コールアウト（右40%） -->
        <div style="display:flex; flex:1; overflow:hidden;">

          <!-- 左：円グラフエリア -->
          <div style="width:60%; padding:0 48px 0 0; display:flex; flex-direction:column; border-right:1px solid #E8E8E8;">
            <div class="area-label">Chart Area（円グラフ）</div>
            <div class="placeholder-box" style="flex:1; flex-direction:column; gap:24px;">
              <!-- 円グラフのプレースホルダー -->
              <div style="width:320px; height:320px; border-radius:50%; background:conic-gradient(#AAAAAA 0% 27%, #BBBBBB 27% 52%, #CCCCCC 52% 70%, #DDDDDD 70% 86%, #C8C8C8 86% 100%); position:relative;">
              </div>
              <div style="font-size:20px; color:#999;">引き出し線＋ラベルが各セグメントに付く</div>
            </div>
          </div>

          <!-- 右：コールアウトエリア -->
          <div style="width:40%; padding:0 0 0 48px; display:flex; flex-direction:column; justify-content:center;">
            <div class="area-label">Callout Box</div>
            <div style="border:4px solid #CCCCCC; border-radius:16px; padding:40px 48px; background:#F8F8F8;">
              <div style="font-size:28px; font-weight:bold; color:#444444; line-height:1.6; text-align:center;">
                強調したいデータや<br>メッセージが入ります
              </div>
            </div>
            <div style="margin-top:24px;">
              <div class="area-label">Label（オプション）</div>
              <div style="font-size:24px; font-weight:bold; color:#666; text-align:center;">ラベルテキスト</div>
            </div>
          </div>

        </div>
      </div>

      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
