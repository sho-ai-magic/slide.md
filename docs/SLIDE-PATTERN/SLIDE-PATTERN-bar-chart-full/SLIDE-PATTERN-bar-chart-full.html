<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-bar-chart-full</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .placeholder-box { background: #F0F0F0; border: 2px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; color: #AAAAAA; font-size: 24px; }
  .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 24px 60px; }
  .annotation-row { display: flex; align-items: center; gap: 32px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-size: 22px; color: #666666; }
  .legend-dot { width: 20px; height: 20px; border-radius: 50%; }
  .chart-area { flex: 1; display: flex; flex-direction: column; position: relative; }
  .kpi-badge { position: absolute; top: 8px; right: 0; background: #F0F0F0; border: 2px dashed #CCCCCC; padding: 16px 28px; text-align: right; }
  .kpi-value { font-size: 52px; font-weight: bold; color: #333333; }
  .kpi-sub { font-size: 24px; color: #999999; margin-top: 4px; }
  .bars-area { flex: 1; display: flex; align-items: flex-end; gap: 12px; padding: 0 20px 56px 20px; border-bottom: 4px solid #CCCCCC; border-left: 2px solid #CCCCCC; }
  .bar-group { flex: 1; display: flex; align-items: flex-end; justify-content: center; }
  .bar { width: 36px; background: #E0E0E0; position: relative; }
  .bar.highlight { background: #C0C0C0; }
  .bar-label { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #666666; white-space: nowrap; }
  .xaxis-labels { display: flex; gap: 12px; padding: 8px 20px 0; }
  .xaxis-group { flex: 1; text-align: center; font-size: 18px; color: #999999; }
</style>
</head>
<body>
<p class="slide-label">[bar-chart-full]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">
      <!-- タイトルエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:28px 80px 24px; border-bottom:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA;">
        <div class="area-label">Title Area — SLIDE.md 参照</div>
        <div style="font-size:32px; color:#CCCCCC; margin-top:8px;">スライドタイトルが入ります</div>
      </div>
      <!-- コンテンツエリア -->
      <div class="content-area">
        <div class="annotation-row">
          <div class="area-label" style="margin-bottom:0;">単位・凡例エリア</div>
          <div class="legend-item"><div class="legend-dot" style="background:#C0C0C0;"></div>系列A</div>
          <div class="legend-item"><div class="legend-dot" style="background:#999999;"></div>系列B（折れ線）</div>
        </div>
        <div class="chart-area">
          <div class="kpi-badge">
            <div class="area-label" style="margin-bottom:2px;">KPI Badge</div>
            <div class="kpi-value">51,899</div>
            <div class="kpi-sub">YoY +19.4%</div>
          </div>
          <div class="bars-area">
            <div class="bar-group"><div class="bar" style="height:28%;"><span class="bar-label">6,000</span></div></div>
            <div class="bar-group"><div class="bar" style="height:32%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:36%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:40%"><span class="bar-label">17,675</span></div></div>
            <div class="bar-group"><div class="bar" style="height:42%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:46%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:50%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:54%;"><span class="bar-label">23,252</span></div></div>
            <div class="bar-group"><div class="bar" style="height:56%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:60%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:64%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:68%;"><span class="bar-label">34,139</span></div></div>
            <div class="bar-group"><div class="bar" style="height:72%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:76%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:80%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:84%;"><span class="bar-label">43,468</span></div></div>
            <div class="bar-group"><div class="bar" style="height:86%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:90%;"></div></div>
            <div class="bar-group"><div class="bar" style="height:94%;"></div></div>
            <div class="bar-group"><div class="bar highlight" style="height:100%;"><span class="bar-label">51,899</span></div></div>
          </div>
          <div class="xaxis-labels">
            <div class="xaxis-group">2022年</div>
            <div class="xaxis-group">2023年</div>
            <div class="xaxis-group">2024年</div>
            <div class="xaxis-group">2025年</div>
            <div class="xaxis-group">2026年</div>
          </div>
        </div>
      </div>
      <!-- フッターエリア（SLIDE.mdの Slide Frame で定義） -->
      <div style="padding:16px 80px 20px; border-top:1px dashed #CCCCCC; flex-shrink:0; background:#FAFAFA; display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div class="area-label" style="margin-bottom:4px;">Footer Area — SLIDE.md 参照</div>
          <div style="font-size:18px; color:#CCCCCC;">ブランドフッター</div>
        </div>
        <div style="font-size:18px; color:#CCCCCC;">ページ番号</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
