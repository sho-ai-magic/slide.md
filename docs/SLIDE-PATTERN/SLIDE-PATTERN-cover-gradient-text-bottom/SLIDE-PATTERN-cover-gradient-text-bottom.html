<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SLIDE-PATTERN-cover-gradient-text-bottom</title>
<style>
  body { background: #E8E8E8; padding: 40px 20px; font-family: sans-serif; margin: 0; }
  .slide-label { font-size: 16px; line-height: 1; color: #666; text-align: center; margin: 0 0 12px; }
  .slide-outer { margin: 0 auto 32px; width: 1440px; /* 1920 × 0.75 */ }
  .slide-wrapper { width: 1920px; transform-origin: top left; transform: scale(0.75); margin-bottom: -270px; /* 1080 × (1 - 0.75) */ }
  .slide { width: 1920px; height: 1080px; background: #FFFFFF; border: 1px solid #CCCCCC; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .area-label { font-size: 20px; color: #999999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .placeholder-box { background: #F0F0F0; border: 2px dashed #CCCCCC; display: flex; align-items: center; justify-content: center; color: #AAAAAA; font-size: 24px; }
  /* コンテンツエリア（frame: none のためタイトルエリア・フッターは配置しない） */
  .content-area { flex: 1; position: relative; background: linear-gradient(135deg, #D0D0D0 0%, #F5F5F5 60%, #E8E8E8 100%); overflow: hidden; }
  .logo-box { position: absolute; top: 40px; right: 56px; width: 144px; height: 56px; background: #CCCCCC; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #888888; }
  .bottom-left-text { position: absolute; bottom: 96px; left: 104px; }
  .main-title { font-size: 68px; font-weight: bold; color: #333333; line-height: 1.2; margin-bottom: 28px; }
  .company-line { font-size: 26px; color: #555555; margin-bottom: 12px; }
  .date-line { font-size: 24px; color: #666666; }
</style>
</head>
<body>
<p class="slide-label">[cover-gradient-text-bottom]</p>
<div class="slide-outer">
  <div class="slide-wrapper">
    <div class="slide">
      <!-- コンテンツエリア（スライド全面。frame: none のためタイトルエリア・フッターは配置しない） -->
      <div class="content-area">
        <!-- ロゴ右上 -->
        <div class="area-label" style="position:absolute; top:40px; right:220px;">Logo</div>
        <div class="logo-box">LOGO（写真添付エリア）</div>
        <!-- テキスト左下 -->
        <div class="bottom-left-text">
          <div class="area-label">Main Title</div>
          <div class="main-title">メインタイトルが<br>ここに入ります</div>
          <div class="area-label">Company / Date</div>
          <div class="company-line">サンプル株式会社 ｜ 証券コード：0000</div>
          <div class="date-line">2026年X月X日</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
